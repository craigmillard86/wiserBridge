# Builds the firmware and publishes the browser installer + console to GitHub Pages.
name: Browser installer

on:
  push:
    branches: [master]
    paths:
      - "main/**"
      - "sniffer/**"
      - "sdkconfig.defaults"
      - "sdkconfig.generic"
      - "partitions.csv"
      - "CMakeLists.txt"
      - "web/**"
      - "tools/make_web_manifest.py"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "main/**"
      - "sniffer/**"
      - "sdkconfig.*"
      - "web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.6
    steps:
      - uses: actions/checkout@v4

      - name: Build router (XIAO ESP32-C6)
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          idf.py -B build-xiao -D SDKCONFIG=build-xiao/sdkconfig set-target esp32c6
          idf.py -B build-xiao -D SDKCONFIG=build-xiao/sdkconfig build

      - name: Build router (other ESP32-C6 boards)
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          idf.py -B build-generic -D SDKCONFIG=build-generic/sdkconfig \
            -D SDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.generic" set-target esp32c6
          idf.py -B build-generic -D SDKCONFIG=build-generic/sdkconfig \
            -D SDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.generic" build
          grep -q '^CONFIG_WB_RF_SWITCH_EN_GPIO=-1' build-generic/sdkconfig

      - name: Build sniffer
        shell: bash
        working-directory: sniffer
        run: |
          . $IDF_PATH/export.sh
          idf.py set-target esp32c6
          idf.py build

      - name: Assemble site
        shell: bash
        run: |
          VER="$(sed -n 's/^set(PROJECT_VER "\(.*\)")/\1/p' CMakeLists.txt)+$(echo "$GITHUB_SHA" | cut -c1-7)"
          mkdir -p site
          cp -r web/. site/
          python3 tools/make_web_manifest.py build-xiao site/firmware/router-xiao \
            "WiserBridge router (Seeed XIAO ESP32-C6)" "$VER"
          python3 tools/make_web_manifest.py build-generic site/firmware/router-generic \
            "WiserBridge router (other ESP32-C6 boards)" "$VER"
          python3 tools/make_web_manifest.py sniffer/build site/firmware/sniffer \
            "WiserBridge sniffer (ESP32-C6)" "$VER"
          echo "$VER" > site/firmware/version.txt

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
